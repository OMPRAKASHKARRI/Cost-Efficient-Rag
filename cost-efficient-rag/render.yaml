services:
  - type: web
    name: cost-efficient-rag
    runtime: python

    buildCommand: |
      pip install -r requirements.txt

    startCommand: |
      uvicorn src.api:app --host 0.0.0.0 --port $PORT

    envVars:
      - key: GROQ_API_KEY
        sync: false

      - key: LLM_PROVIDER
        value: groq

      - key: LLM_MODEL_NAME
        value: openai/gpt-oss-120b